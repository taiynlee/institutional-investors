services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_force
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_force"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://stock:secret@db:5432/stock_force
      FINMIND_TOKEN: ""
      SKIP_STARTUP_SYNC: "1"
      LINE_BOT_URL: "http://172.17.0.1:8001"
    volumes:
      - ./config:/app/config:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "6174:80"
    depends_on:
      - backend
      - fubon-dashboard

  fubon-dashboard:
    build: ./services/fubon-dashboard
    restart: unless-stopped
    environment:
      FUBON_DATA_DIR: /fubon-data
      FUBON_LOG_DIR: /fubon-logs
      FUBON_CONFIG: /fubon-config/config.yaml
    volumes:
      - /home/tommy0322/fubon/data:/fubon-data
      - /home/tommy0322/fubon/logs:/fubon-logs:ro
      - /home/tommy0322/fubon/config.yaml:/fubon-config/config.yaml:ro

volumes:
  pgdata:
